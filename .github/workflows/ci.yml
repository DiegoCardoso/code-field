name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Prettier
        run: npm run lint:format
      - name: ESLint
        run: npm run lint:js

  chrome:
    name: Unit tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The runner ships Google Chrome, but install it explicitly so the job does
      # not depend on the image's contents. `channel: 'chrome'` in the test config
      # means real Chrome, not bundled Chromium — deliberate, because `:autofill`
      # and password-manager behaviour differ between them (SPEC §11.3, §14.1).
      - name: Install Chrome
        run: npx playwright install chrome --with-deps
      - name: Test
        working-directory: web
        run: npx web-test-runner

  firefox:
    name: Unit tests (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Firefox is not optional coverage: it carries W-3's backward-selection
      # case (SPEC §7.8.1), which Chromium cannot exercise.
      - name: Install Firefox
        run: npx playwright install firefox --with-deps
      - name: Test
        working-directory: web
        run: npx web-test-runner --config web-test-runner-firefox.config.js

  # SPEC §14.2. In the pinned image only: baselines from any other renderer differ in fonts
  # and antialiasing. scripts/visual.sh runs the same image locally and reads it from here.
  visual:
    name: Visual
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - name: Visual tests
        working-directory: web
        run: npx web-test-runner --config web-test-runner-visual.config.js
      - name: Upload failed screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failed
          path: web/test/visual/screenshots/*/failed/
          if-no-files-found: ignore

  flow:
    name: Flow (unit + integration)
    runs-on: ubuntu-latest
    # The first IT waits for Vaadin to npm-install and build the dev bundle.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      # Vaadin builds the IT dev bundle with Node. It supports up to 24 and falls back to
      # downloading its own above that; Node 24 here means it uses this one.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The dev bundle's npm install, and the Node Vaadin would otherwise fetch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.vaadin
          key: flow-npm-${{ hashFiles('flow/**/pom.xml', 'web/package.json') }}
          restore-keys: flow-npm-
      # Playwright for Java 1.63 uses the same browser builds as npm's playwright
      # 1.63, so the npm CLI installs them, system dependencies included.
      - name: Install Playwright browsers
        run: npx -y playwright@1.63.0 install --with-deps chromium firefox
      # Unit tests, then the ITs in Chromium and Firefox, against web/ through the
      # file: link — which resolves from a clean checkout, so no publish is needed.
      - name: Test
        working-directory: flow
        # Without this, Playwright for Java runs its own install on first use and also
        # fetches WebKit; with it, a missing browser fails fast instead.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: mvn -B verify
      - name: Upload IT reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow-it-reports
          path: flow/**/target/failsafe-reports/

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # A squash merge puts the PR *title* into main's history, so the title is
      # what actually needs to be conventional — the commit hook cannot see it.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
