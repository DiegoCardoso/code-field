  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"8feebaaa-9fb1-4185-a558-8b627319d711\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =====================================================================\n   Aura — Vaadin Design System\n   colors_and_type.css\n\n   Tokens distilled from the Aura Figma file. Aura is the Vaadin theme\n   for enterprise SaaS — neutral, dense, trustworthy. Default theme is\n   light; toggle [data-theme=\"dark\"] on a parent for dark mode.\n   ===================================================================== */\n\n/* ---------- Fonts ----------------------------------------------------\n   Aura uses Instrument Sans (variable: weight + width axes) for all\n   typography. The system font stack is the documented fallback. The\n   font file ships with the design system at fonts/.\n   ----------------------------------------------------------------- */\n@font-face {\n  font-family: \"Instrument Sans\";\n  src: url(\"9fb50696-81d8-4cbf-bccb-ba628f2f5d96\") format(\"truetype-variations\"),\n       url(\"9fb50696-81d8-4cbf-bccb-ba628f2f5d96\") format(\"truetype\");\n  font-weight: 400 700;\n  font-stretch: 75% 100%;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ---- Type families ---- */\n  --aura-font-sans:    \"Instrument Sans\", -apple-system, \"Segoe UI\", Roboto, system-ui, sans-serif;\n  --aura-font-display: \"Instrument Sans\", -apple-system, \"Segoe UI\", Roboto, system-ui, sans-serif;\n  --aura-font-mono:    \"Instrument Sans\", -apple-system, \"Segoe UI\", Roboto, system-ui, sans-serif;\n\n  /* ---- Type scale ---- */\n  --aura-text-xs:   12px;  /* helper text — tight metadata, hints   */\n  --aura-text-s:    13px;  /* secondary body, dense list rows        */\n  --aura-text-base: 14px;  /* DEFAULT body / UI text                 */\n  --aura-text-m:    16px;  /* subsection heading                     */\n  --aura-text-l:    18px;  /* section heading                        */\n  --aura-text-xl:   18px;  /* alias                                  */\n  --aura-text-2xl:  18px;  /* alias                                  */\n  --aura-text-3xl:  18px;  /* alias                                  */\n  --aura-text-4xl:  18px;  /* alias                                  */\n\n  --aura-leading-tight:   1.05;\n  --aura-leading-snug:    1.25;\n  --aura-leading-normal:  1.45;\n  --aura-leading-relaxed: 1.6;\n\n  --aura-weight-regular:  400;\n  --aura-weight-medium:   500;\n  --aura-weight-semibold: 600;\n  --aura-weight-bold:     600;\n\n  /* ============== LIGHT THEME ============== */\n\n  /* ---- Base palette (raw) ---- */\n  --aura-blue-50:   #eef3ff;\n  --aura-blue-100:  #d8e3ff;\n  --aura-blue-200:  #b3c7ff;\n  --aura-blue-300:  #7da0ff;\n  --aura-blue-400:  #5176e8;\n  --aura-blue-500:  rgb(50,102,228);   /* Vaadin Accent — primary brand blue */\n  --aura-blue-600:  rgb(43,89,200);    /* link / pressed */\n  --aura-blue-700:  rgb(26,56,96);\n  --aura-blue-800:  rgb(25,59,103);\n  --aura-blue-900:  rgb(19,22,27);\n\n  --aura-ink-900:   rgb(11,11,11);    /* primary text & black surfaces */\n  --aura-ink-800:   rgb(19,22,27);\n  --aura-ink-700:   rgb(46,50,56);\n  --aura-ink-600:   rgb(99,105,114);\n  --aura-ink-500:   rgb(148,154,162);\n  --aura-ink-400:   rgb(194,194,194);\n  --aura-ink-300:   rgb(214,217,220);\n  --aura-ink-200:   rgb(224,224,224);\n  --aura-ink-100:   rgb(233,233,233);\n  --aura-ink-50:    rgb(236,239,242);  /* page background tint, header tint */\n  --aura-white:     #ffffff;\n\n  /* Semantic */\n  --aura-green:     rgb(0,159,52);\n  --aura-red:       rgb(219,55,58);\n  --aura-red-dark:  rgb(162,5,25);\n  --aura-yellow:    rgb(255,220,0);\n  --aura-orange:    rgb(220,86,0);\n  --aura-purple:    rgb(126,85,240);\n  --aura-purple-dark: rgb(67,28,143);\n  --aura-purple-bg: rgb(250,248,255);\n  --aura-cyan:      rgb(26,188,254);\n\n  /* User colors (for avatars, charts, presence) — indexed 0..9 */\n  --aura-user-0: rgb(50,102,228);\n  --aura-user-1: rgb(0,210,205);\n  --aura-user-2: rgb(179,50,157);\n  --aura-user-3: rgb(135,178,255);\n  --aura-user-4: rgb(3,134,131);\n  --aura-user-5: rgb(254,123,228);\n  --aura-user-6: rgb(190,70,0);\n  --aura-user-7: rgb(165,197,1);\n  --aura-user-8: rgb(103,125,1);\n  --aura-user-9: rgb(255,141,69);\n\n  /* ---- Semantic aliases (light) ---- */\n  --aura-bg:            var(--aura-white);            /* app surface */\n  --aura-bg-tint:       var(--aura-ink-50);           /* page header/banner tint */\n  --aura-bg-subtle:     rgba(25,59,103,0.05);         /* hover row, panel tint */\n  --aura-bg-overlay:    rgba(11,11,11,0.40);          /* modal scrim */\n  --aura-surface-1:     var(--aura-white);            /* card */\n  --aura-surface-2:     #f7f9fb;                      /* sidebar */\n  --aura-surface-3:     var(--aura-ink-50);           /* sunken */\n\n  --aura-fg:            var(--aura-ink-900);          /* primary text */\n  --aura-fg-secondary:  rgba(11,11,11,0.65);          /* secondary copy */\n  --aura-fg-tertiary:   rgba(11,11,11,0.45);          /* placeholder */\n  --aura-fg-disabled:   rgba(11,11,11,0.30);\n  --aura-fg-on-accent:  var(--aura-white);            /* text on blue */\n  --aura-fg-link:       var(--aura-blue-600);\n\n  --aura-border:        rgba(41,65,112,0.18);         /* divider */\n  --aura-border-strong: var(--aura-ink-900);          /* field outline */\n  --aura-border-subtle: rgba(3,3,3,0.08);\n\n  --aura-accent:        var(--aura-blue-500);\n  --aura-accent-hover:  var(--aura-blue-600);\n  --aura-accent-text:   var(--aura-blue-600);\n  --aura-accent-bg-subtle: rgba(50,102,228,0.10);\n\n  --aura-success:       var(--aura-green);\n  --aura-error:         var(--aura-red);\n  --aura-warning:       var(--aura-orange);\n  --aura-info:          var(--aura-cyan);\n\n  /* ---- Spacing ---- */\n  --aura-space-3xs: 2px;\n  --aura-space-2xs: 4px;\n  --aura-space-xs:  6px;\n  --aura-space-s:   8px;\n  --aura-space-m:   12px;\n  --aura-space-l:   16px;\n  --aura-space-xl:  24px;\n  --aura-space-2xl: 32px;\n  --aura-space-3xl: 48px;\n  --aura-space-4xl: 64px;\n\n  /* ---- Radii (Aura's \"Shapes\") ---- */\n  --aura-radius-s: 5px;   /* checkboxes, small chips                */\n  --aura-radius-m: 9px;   /* buttons, input fields, normal elements */\n  --aura-radius-l: 15px;  /* dialogs, cards                          */\n  --aura-radius-full: 9999px;\n\n  /* ---- Shadows (Aura's elevation system) ---- */\n  --aura-shadow-xs: 0 1px 4px -1px rgba(28,48,74,0.52);\n  --aura-shadow-s:  0 2px 5px -1px rgba(20,20,20,0.20);\n  --aura-shadow-m:  0 4px 12px -2px rgba(28,48,74,0.18), 0 1px 3px rgba(20,20,20,0.10);\n  --aura-shadow-overlay: 0 12px 32px -8px rgba(28,48,74,0.32), 0 2px 6px rgba(20,20,20,0.08);\n  --aura-shadow-focus: 0 0 0 2px rgba(50,102,228,0.45);\n  --aura-shadow-inset-field: inset 0 1px 4px -2px rgba(20,20,20,0.20);\n\n  /* ---- Motion ---- */\n  --aura-ease:        cubic-bezier(0.2, 0.0, 0.0, 1.0);\n  --aura-ease-out:    cubic-bezier(0.0, 0.0, 0.2, 1.0);\n  --aura-duration-fast:   120ms;\n  --aura-duration-normal: 200ms;\n  --aura-duration-slow:   320ms;\n}\n\n/* ============== DARK THEME ============== */\n[data-theme=\"dark\"] {\n  --aura-bg:            #000000;\n  --aura-bg-tint:       rgb(19,22,27);\n  --aura-bg-subtle:     rgba(255,255,255,0.05);\n  --aura-bg-overlay:    rgba(0,0,0,0.55);\n  --aura-surface-1:     rgb(11,14,19);\n  --aura-surface-2:     rgb(19,22,27);\n  --aura-surface-3:     rgb(10,11,13);\n\n  --aura-fg:            #ffffff;\n  --aura-fg-secondary:  rgba(255,255,255,0.65);\n  --aura-fg-tertiary:   rgba(255,255,255,0.45);\n  --aura-fg-disabled:   rgba(255,255,255,0.30);\n  --aura-fg-on-accent:  #ffffff;\n  --aura-fg-link:       rgb(150,189,255);\n\n  --aura-border:        rgba(255,255,255,0.16);\n  --aura-border-strong: rgba(255,255,255,0.55);\n  --aura-border-subtle: rgba(255,255,255,0.08);\n\n  --aura-accent:        var(--aura-blue-500);\n  --aura-accent-hover:  rgb(80,128,238);\n  --aura-accent-text:   rgb(150,189,255);\n  --aura-accent-bg-subtle: rgba(50,102,228,0.20);\n}\n\n/* ============== Semantic typography ============== */\n.aura-h1, h1.aura {\n  font-family: var(--aura-font-display);\n  font-weight: var(--aura-weight-bold);\n  font-size: var(--aura-text-4xl);\n  line-height: var(--aura-leading-tight);\n  letter-spacing: -0.01em;\n  color: var(--aura-fg);\n  margin: 0;\n}\n.aura-h2, h2.aura {\n  font-family: var(--aura-font-display);\n  font-weight: var(--aura-weight-bold);\n  font-size: var(--aura-text-3xl);\n  line-height: var(--aura-leading-tight);\n  letter-spacing: -0.005em;\n  color: var(--aura-fg);\n  margin: 0;\n}\n.aura-h3, h3.aura {\n  font-family: var(--aura-font-display);\n  font-weight: var(--aura-weight-semibold);\n  font-size: var(--aura-text-2xl);\n  line-height: var(--aura-leading-snug);\n  color: var(--aura-fg);\n  margin: 0;\n}\n.aura-h4, h4.aura {\n  font-family: var(--aura-font-sans);\n  font-weight: var(--aura-weight-semibold);\n  font-size: var(--aura-text-xl);\n  line-height: var(--aura-leading-snug);\n  color: var(--aura-fg);\n  margin: 0;\n}\n.aura-body, p.aura {\n  font-family: var(--aura-font-sans);\n  font-weight: var(--aura-weight-regular);\n  font-size: var(--aura-text-l);\n  line-height: var(--aura-leading-relaxed);\n  color: var(--aura-fg);\n  margin: 0;\n}\n.aura-body-s {\n  font-family: var(--aura-font-sans);\n  font-size: var(--aura-text-base);\n  line-height: var(--aura-leading-normal);\n  color: var(--aura-fg);\n}\n.aura-label {\n  font-family: var(--aura-font-sans);\n  font-weight: var(--aura-weight-medium);\n  font-size: var(--aura-text-base);\n  line-height: 1.0;\n  color: var(--aura-fg);\n}\n.aura-helper {\n  font-family: var(--aura-font-sans);\n  font-size: var(--aura-text-xs);\n  line-height: 1.45;\n  color: var(--aura-fg-secondary);\n}\n.aura-caption {\n  font-family: var(--aura-font-sans);\n  font-size: var(--aura-text-s);\n  line-height: 1.4;\n  color: var(--aura-fg-secondary);\n}\n.aura-button-text {\n  font-family: var(--aura-font-sans);\n  font-weight: var(--aura-weight-medium);\n  font-size: var(--aura-text-base);\n  line-height: 20px;\n}\n.aura-code, code.aura {\n  font-family: var(--aura-font-mono);\n  font-size: 0.875em;\n  background: var(--aura-bg-subtle);\n  padding: 0.1em 0.35em;\n  border-radius: var(--aura-radius-s);\n  color: var(--aura-fg);\n}\n.aura-link {\n  color: var(--aura-fg-link);\n  text-decoration: underline;\n  text-underline-offset: 2px;\n}\n.aura-link:hover { text-decoration: none; }\n<\u002Fstyle>\n<script src=\"c2cc8924-a05a-4783-953d-c37237aa3957\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #fff; }\n  @keyframes cf-blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }\n  @media (prefers-reduced-motion: reduce) { [data-cf-caret] { animation: none !important } }\n  #cf-live-input::selection { background: transparent; color: transparent; }\n  a { color: var(--aura-fg-link); text-decoration: underline; text-underline-offset: 2px; }\n  a:hover { text-decoration: none; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1480px;margin:0 auto;padding:48px 48px 96px;display:flex;flex-direction:column;gap:56px;font-family:var(--aura-font-sans);color:rgb(11,11,11);--cf-font:var(--aura-font-sans);--cf-fg:rgb(11,11,11);--cf-fg-2:rgba(11,11,11,0.65);--cf-fg-3:rgba(11,11,11,0.45);--cf-label-fs:14px;--cf-label-fw:500;--cf-label-c:rgb(11,11,11);--cf-w:44px;--cf-h:48px;--cf-fs:20px;--cf-gap:6px;--cf-r:9px;--cf-slot-bg:rgba(255,255,255,0.7);--cf-rest-shadow:inset 0 0 0 1px rgb(10,11,13);--cf-active-shadow:inset 0 0 0 2px rgb(50,102,228);--cf-active-bg:rgba(50,102,228,0.10);--cf-sel-bg:rgba(50,102,228,0.18);--cf-ring:rgba(50,102,228,0.45);--cf-accent:rgb(50,102,228);--cf-err-shadow:inset 0 0 0 1px rgb(219,55,58);--cf-err-fg:rgb(162,5,25);--cf-dis-bg:rgba(25,59,103,0.05);--cf-dis-shadow:inset 0 0 0 1px rgba(41,65,112,0.18);--cf-dis-fg:rgba(11,11,11,0.30);--cf-ro-bc:rgba(41,65,112,0.35);--cf-divider:rgba(41,65,112,0.18)\">\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(11,11,11,0.45)\">Component specification · draft<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-0.01em\">&lt;vaadin-code-field&gt;<\u002Fh1>\n    <p style=\"margin:0;font-size:16px;line-height:1.55;color:rgba(11,11,11,0.65);text-wrap:pretty\">A single-value field for entering short fixed-length codes — one-time passwords, 2FA codes, email verification codes, PINs, redeem and license keys — rendered as a row of per-character boxes. The component holds one string value; the boxes are a presentation of that value, not separate fields.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:4px\">\n      <span style=\"font-size:12px;font-weight:500;padding:3px 8px;border-radius:5px;background:rgba(25,59,103,0.05);color:rgba(11,11,11,0.65)\">packages/code-field<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:500;padding:3px 8px;border-radius:5px;background:rgba(25,59,103,0.05);color:rgba(11,11,11,0.65)\">vaadin-code-field-flow<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:500;padding:3px 8px;border-radius:5px;background:rgba(50,102,228,0.10);color:rgb(43,89,200)\">Lumo + Aura<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid rgba(41,65,112,0.18)\">\n      <h2 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.005em\">Live behaviour<\u002Fh2>\n      <p style=\"margin:0;font-size:13px;line-height:1.45;color:rgba(11,11,11,0.65)\">One real input, visually hidden, with a decorative slot layer over it. Type, arrow, backspace, select a range, or paste <code class=\"aura\">123-456<\u002Fcode> — the paste sanitiser strips the separator rather than rejecting the whole value.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <label for=\"cf-live-input\" style=\"font-size:var(--cf-label-fs);font-weight:var(--cf-label-fw);line-height:1;color:var(--cf-label-c)\">Verification code<\u002Flabel>\n        <div style=\"position:relative;width:fit-content\">\n          <div style=\"{{ liveFieldStyle }}\" aria-hidden=\"true\">\n            <sc-for list=\"{{ liveItems }}\" as=\"it\" hint-placeholder-count=\"6\">\n              <div style=\"{{ it.style }}\">{{ it.char }}<sc-if value=\"{{ it.caret }}\" hint-placeholder-val=\"{{ false }}\"><span data-cf-caret=\"\" style=\"position:absolute;width:2px;height:22px;border-radius:1px;background:var(--cf-accent);animation:cf-blink 1.1s steps(1,end) infinite\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <input id=\"cf-live-input\" ref=\"{{ inputRef }}\" value=\"{{ liveValue }}\" sc-camel-on-input=\"{{ onInput }}\" sc-camel-on-select=\"{{ onSelect }}\" sc-camel-on-focus=\"{{ onFocus }}\" sc-camel-on-blur=\"{{ onBlur }}\" sc-camel-on-paste=\"{{ onPaste }}\" inputmode=\"numeric\" autocomplete=\"one-time-code\" spellcheck=\"false\" autocorrect=\"off\" maxlength=\"{{ liveLength }}\" style=\"position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0 0 0 19px;border:0;outline:0;box-sizing:border-box;background:transparent;color:transparent;caret-color:transparent;font-family:var(--aura-font-sans);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:39px;opacity:1;-webkit-text-fill-color:transparent\">\n        <\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.45;color:var(--cf-fg-2)\">Enter the 6-digit code we sent to your email<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:300px;max-width:460px;border:1px solid rgba(41,65,112,0.18);border-radius:15px;padding:20px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(11,11,11,0.45)\">Field state<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:13px;line-height:1.4\">\n          <span style=\"color:rgba(11,11,11,0.65)\">value<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ readoutValue }}<\u002Fspan>\n          <span style=\"color:rgba(11,11,11,0.65)\">complete<\u002Fspan><span>{{ readoutComplete }}<\u002Fspan>\n          <span style=\"color:rgba(11,11,11,0.65)\">active slot<\u002Fspan><span>{{ readoutActive }}<\u002Fspan>\n          <span style=\"color:rgba(11,11,11,0.65)\">selection<\u002Fspan><span>{{ readoutSel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:rgba(41,65,112,0.18)\"><\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(11,11,11,0.45)\">Events<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;min-height:76px\">\n          <sc-for list=\"{{ log }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"font-size:12px;line-height:1.4;color:{{ row.color }}\">{{ row.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:12px;line-height:1.5;color:rgba(11,11,11,0.45);max-width:760px\">Not representable here: SMS autofill, the iOS long-press menu and selection artefact, autofill background overrides, and password-manager badges. Those are the device matrix in §14.3.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid rgba(41,65,112,0.18)\">\n      <h2 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.005em\">State matrix<\u002Fh2>\n      <p style=\"margin:0;font-size:13px;line-height:1.45;color:rgba(11,11,11,0.65)\">The component ships no visual opinion; each theme styles the same parts and state attributes. Aura outlines the slot in near-black at 9px radius; Lumo fills it with contrast-10% and no outline.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:stretch;overflow-x:auto;padding-bottom:8px\">\n      <sc-for list=\"{{ themes }}\" as=\"th\" hint-placeholder-count=\"4\">\n        <div style=\"{{ th.style }}\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;padding-bottom:16px\">\n            <div style=\"font-size:14px;font-weight:600;color:var(--cf-fg)\">{{ th.name }}<\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.4;color:var(--cf-fg-3)\">{{ th.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ states }}\" as=\"st\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;flex-direction:column;gap:9px;padding:18px 0;border-top:1px solid var(--cf-divider)\">\n              <div style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--cf-fg-3)\">{{ st.name }}<\u002Fdiv>\n              <div style=\"font-size:var(--cf-label-fs);font-weight:var(--cf-label-fw);line-height:1;color:var(--cf-label-c);opacity:{{ st.labelOpacity }}\">{{ st.label }}<\u002Fdiv>\n              <div style=\"{{ st.fieldStyle }}\">\n                <sc-for list=\"{{ st.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n                  <div style=\"{{ it.style }}\">{{ it.char }}<sc-if value=\"{{ it.caret }}\" hint-placeholder-val=\"{{ false }}\"><span data-cf-caret=\"\" style=\"position:absolute;width:2px;height:22px;border-radius:1px;background:var(--cf-accent);animation:cf-blink 1.1s steps(1,end) infinite\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.45;color:{{ st.msgColor }}\">{{ st.msg }}<\u002Fdiv>\n              <div style=\"font-size:11px;line-height:1.45;color:var(--cf-fg-3)\">{{ st.ref }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid rgba(41,65,112,0.18)\">\n      <h2 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.005em\">Open question — slot focus treatment<\u002Fh2>\n      <p style=\"margin:0;font-size:13px;line-height:1.45;color:rgba(11,11,11,0.65)\">§9 requires focus indication on the active slot <em>and<\u002Fem> a focus ring on the field as a whole. All three below keep the field ring; they differ in what marks the slot. Shown in Aura light with a 4-digit value and the append slot active.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n      <sc-for list=\"{{ focusOptions }}\" as=\"op\" hint-placeholder-count=\"3\">\n        <div style=\"flex:1;min-width:340px;border:1px solid rgba(41,65,112,0.18);border-radius:15px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:{{ op.badgeBg }};color:{{ op.badgeFg }}\">{{ op.id }}<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:600\">{{ op.name }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:500;color:{{ op.tagColor }}\">{{ op.tag }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"{{ op.fieldStyle }}\">\n            <sc-for list=\"{{ op.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n              <div style=\"{{ it.style }}\">{{ it.char }}<sc-if value=\"{{ it.caret }}\" hint-placeholder-val=\"{{ false }}\"><span data-cf-caret=\"\" style=\"position:absolute;width:2px;height:22px;border-radius:1px;background:var(--cf-accent);animation:cf-blink 1.1s steps(1,end) infinite\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.5;color:rgba(11,11,11,0.65);text-wrap:pretty\">{{ op.note }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid rgba(41,65,112,0.18)\">\n      <h2 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.005em\">Open question — separator rendering<\u002Fh2>\n      <p style=\"margin:0;font-size:13px;line-height:1.45;color:rgba(11,11,11,0.65)\">Grouping is purely visual and the separator is never part of <code class=\"aura\">value<\u002Fcode> (§12.5). What changes between these is the slot geometry the caret and the selection band have to land on.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:340px;border:1px solid rgba(41,65,112,0.18);border-radius:15px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:rgba(50,102,228,0.10);color:rgb(43,89,200)\">B1<\u002Fspan>\n          <span style=\"font-size:14px;font-weight:600\">Separator character<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:500;color:rgb(0,159,52)\">Selected<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:var(--cf-gap);width:fit-content;padding:3px;border-radius:13px\">\n          <div style=\"{{ sepSlotStyle }}\">4<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">8<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">2<\u002Fdiv>\n          <div style=\"width:14px;display:grid;place-items:center;font-size:20px;color:var(--cf-fg-3)\">–<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">9<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">1<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">3<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:rgba(11,11,11,0.65);text-wrap:pretty\"><code class=\"aura\">groups=\"3 3\"<\u002Fcode> with <code class=\"aura\">separator=\"–\"<\u002Fcode>. Slot geometry is unchanged, so hit testing, the caret and a selection crossing the boundary all keep working. The glyph carries the redeem-code and license-key affordance, and <code class=\"aura\">part=\"separator\"<\u002Fcode> with <code class=\"aura\">separator-index<\u002Fcode> lets a theme or an application restyle or replace it without touching the slots.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:340px;border:1px solid rgba(41,65,112,0.18);border-radius:15px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:rgba(25,59,103,0.05);color:rgba(11,11,11,0.65)\">B2<\u002Fspan>\n          <span style=\"font-size:14px;font-weight:600\">Gap only<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:500;color:rgba(11,11,11,0.45)\">Same component, empty separator<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:var(--cf-gap);width:fit-content;padding:3px;border-radius:13px\">\n          <div style=\"{{ sepSlotStyle }}\">4<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">8<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">2<\u002Fdiv>\n          <div style=\"width:14px\"><\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">9<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">1<\u002Fdiv>\n          <div style=\"{{ sepSlotStyle }}\">3<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:rgba(11,11,11,0.65);text-wrap:pretty\"><code class=\"aura\">separator=\"\"<\u002Fcode>. Quieter, and correct for a 6-digit OTP where nothing is dashed in the email. Falls out of B1 for free, so it needs no separate API.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:340px;border:1px solid rgba(41,65,112,0.18);border-radius:15px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:rgba(25,59,103,0.05);color:rgba(11,11,11,0.65)\">B3<\u002Fspan>\n          <span style=\"font-size:14px;font-weight:600\">Grouped container<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:500;color:rgb(162,5,25)\">Not recommended<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;width:fit-content;padding:3px;border-radius:13px\">\n          <div style=\"display:flex;border-radius:var(--cf-r);overflow:hidden;box-shadow:var(--cf-rest-shadow);background:var(--cf-slot-bg)\">\n            <div style=\"{{ groupSlotStyle }}\">4<\u002Fdiv>\n            <div style=\"{{ groupSlotStyleDiv }}\">8<\u002Fdiv>\n            <div style=\"{{ groupSlotStyleDiv }}\">2<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;border-radius:var(--cf-r);overflow:hidden;box-shadow:var(--cf-rest-shadow);background:var(--cf-slot-bg)\">\n            <div style=\"{{ groupSlotStyle }}\">9<\u002Fdiv>\n            <div style=\"{{ groupSlotStyleDiv }}\">1<\u002Fdiv>\n            <div style=\"{{ groupSlotStyleDiv }}\">3<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:rgba(11,11,11,0.65);text-wrap:pretty\">One outline per group. The active slot has no outline of its own left to thicken, and a selection spanning the boundary renders as two disconnected fragments — the same failure §9 forbids wrapping for.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;length&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:4,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Live field&quot;},&quot;mask&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Live field&quot;},&quot;focusTreatment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;outline&quot;,&quot;fill&quot;,&quot;caret&quot;],&quot;default&quot;:&quot;outline&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Design decisions&quot;},&quot;separatorStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;char&quot;,&quot;gap&quot;],&quot;default&quot;:&quot;char&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Design decisions&quot;}}\">\nconst EASE = 'cubic-bezier(.2,0,0,1)';\nconst SLOT = 'display:grid;place-items:center;box-sizing:border-box;position:relative;width:var(--cf-w);height:var(--cf-h);border-radius:var(--cf-r);font-family:var(--cf-font);font-size:var(--cf-fs);font-weight:500;font-variant-numeric:tabular-nums;transition:box-shadow 120ms ' + EASE + ',background 120ms ' + EASE + ';';\nconst KIND = {\n  rest: 'background:var(--cf-slot-bg);box-shadow:var(--cf-rest-shadow);color:var(--cf-fg);border:0;',\n  fill: 'background:var(--cf-active-bg);box-shadow:var(--cf-active-shadow);color:var(--cf-fg);border:0;',\n  outline: 'background-color:var(--cf-slot-bg);background-image:linear-gradient(var(--cf-outline-bg),var(--cf-outline-bg));box-shadow:var(--cf-active-shadow);color:var(--cf-fg);border:0;',\n  caret: 'background:var(--cf-slot-bg);box-shadow:var(--cf-rest-shadow);color:var(--cf-fg);border:0;',\n  sel: 'background:var(--cf-sel-bg);box-shadow:var(--cf-rest-shadow);color:var(--cf-fg);border:0;',\n  disabled: 'background:var(--cf-dis-bg);box-shadow:var(--cf-dis-shadow);color:var(--cf-dis-fg);border:0;',\n  readonly: 'background:transparent;box-shadow:none;color:var(--cf-fg);border:1px dashed var(--cf-ro-bc);',\n  invalid: 'background:var(--cf-slot-bg);box-shadow:var(--cf-err-shadow);color:var(--cf-fg);border:0;'\n};\nconst FIELD = 'display:flex;align-items:center;gap:var(--cf-gap);width:fit-content;padding:3px;border-radius:calc(var(--cf-r) + 4px);transition:box-shadow 120ms ' + EASE + ';';\n\nfunction buildItems(cfg) {\n  const value = cfg.value || '';\n  const len = cfg.len || 6;\n  const base = cfg.base || 'rest';\n  const active = cfg.active === undefined ? -1 : cfg.active;\n  const activeKind = cfg.activeKind || 'fill';\n  const sel = cfg.selRange || null;\n  const groups = cfg.groups || null;\n  const sepMode = cfg.sepMode || 'char';\n  const out = [];\n  let bound = 0, g = 0;\n  for (let i = 0; i < len; i++) {\n    const filled = i < value.length;\n    const ch = filled ? (cfg.mask ? '\\u2022' : value[i]) : (cfg.placeholderChar || '');\n    let kind = base;\n    if (base === 'rest') {\n      if (sel && i >= sel[0] && i < sel[1]) kind = 'sel';\n      else if (i === active) kind = activeKind;\n    }\n    out.push({\n      key: 's' + i,\n      char: ch,\n      style: SLOT + KIND[kind] + (!filled && ch ? 'color:var(--cf-fg-3);' : ''),\n      caret: base === 'rest' && i === active && (activeKind === 'caret' || !filled)\n    });\n    if (groups) {\n      bound += 0;\n      if (g < groups.length && i === groups.slice(0, g + 1).reduce((a, b) => a + b, 0) - 1 && i < len - 1) {\n        g += 1;\n        out.push({\n          key: 'sep' + g,\n          char: sepMode === 'gap' ? '' : (cfg.separator || '\\u2013'),\n          style: sepMode === 'gap'\n            ? 'width:14px;flex:none;'\n            : 'width:14px;flex:none;display:grid;place-items:center;font-family:var(--cf-font);font-size:var(--cf-fs);color:var(--cf-fg-3);',\n          caret: false\n        });\n      }\n    }\n  }\n  return out;\n}\n\nconst THEMES = [\n  {\n    id: 'aura-light', name: 'Aura \\u00b7 light', sub: 'Slot outlined 1px rgb(10,11,13), radius 9px, translucent fill',\n    vars: '--cf-font:var(--aura-font-sans);--cf-fg:rgb(11,11,11);--cf-fg-2:rgba(11,11,11,0.65);--cf-fg-3:rgba(11,11,11,0.45);--cf-label-fs:14px;--cf-label-fw:500;--cf-label-c:rgb(11,11,11);--cf-w:44px;--cf-h:48px;--cf-fs:20px;--cf-gap:6px;--cf-r:9px;--cf-slot-bg:rgba(255,255,255,0.7);--cf-rest-shadow:inset 0 0 0 1px rgb(10,11,13);--cf-active-shadow:inset 0 0 0 2px rgb(50,102,228);--cf-active-bg:rgba(50,102,228,0.10);--cf-outline-bg:transparent;--cf-sel-bg:rgba(50,102,228,0.18);--cf-ring:rgba(50,102,228,0.45);--cf-accent:rgb(50,102,228);--cf-err-shadow:inset 0 0 0 1px rgb(219,55,58);--cf-err-fg:rgb(162,5,25);--cf-dis-bg:rgba(25,59,103,0.05);--cf-dis-shadow:inset 0 0 0 1px rgba(41,65,112,0.18);--cf-dis-fg:rgba(11,11,11,0.30);--cf-ro-bc:rgba(41,65,112,0.35);--cf-divider:rgba(41,65,112,0.18);',\n    panel: 'background:#fff;color:rgb(11,11,11);border:1px solid rgba(41,65,112,0.18);'\n  },\n  {\n    id: 'aura-dark', name: 'Aura \\u00b7 dark', sub: 'Outline drops to 55% white; fill lifts to 6% white',\n    vars: '--cf-font:var(--aura-font-sans);--cf-fg:#fff;--cf-fg-2:rgba(255,255,255,0.65);--cf-fg-3:rgba(255,255,255,0.45);--cf-label-fs:14px;--cf-label-fw:500;--cf-label-c:#fff;--cf-w:44px;--cf-h:48px;--cf-fs:20px;--cf-gap:6px;--cf-r:9px;--cf-slot-bg:rgba(255,255,255,0.06);--cf-rest-shadow:inset 0 0 0 1px rgba(255,255,255,0.55);--cf-active-shadow:inset 0 0 0 2px rgb(80,128,238);--cf-active-bg:rgba(50,102,228,0.24);--cf-outline-bg:transparent;--cf-sel-bg:rgba(50,102,228,0.34);--cf-ring:rgba(50,102,228,0.45);--cf-accent:rgb(130,170,255);--cf-err-shadow:inset 0 0 0 1px rgb(255,116,113);--cf-err-fg:rgb(255,146,143);--cf-dis-bg:rgba(255,255,255,0.05);--cf-dis-shadow:inset 0 0 0 1px rgba(255,255,255,0.16);--cf-dis-fg:rgba(255,255,255,0.30);--cf-ro-bc:rgba(255,255,255,0.30);--cf-divider:rgba(255,255,255,0.16);',\n    panel: 'background:rgb(11,14,19);color:#fff;border:1px solid rgba(255,255,255,0.12);'\n  },\n  {\n    id: 'lumo-light', name: 'Lumo \\u00b7 light', sub: 'Filled contrast-10%, no outline, radius 8px, 40px slot',\n    vars: '--cf-font:-apple-system,BlinkMacSystemFont,\"Roboto\",\"Segoe UI\",Helvetica,Arial,sans-serif;--cf-fg:hsla(214,40%,16%,0.94);--cf-fg-2:hsla(214,42%,18%,0.69);--cf-fg-3:hsla(214,45%,20%,0.45);--cf-label-fs:14px;--cf-label-fw:500;--cf-label-c:hsla(214,42%,18%,0.69);--cf-w:40px;--cf-h:40px;--cf-fs:18px;--cf-gap:8px;--cf-r:8px;--cf-slot-bg:hsla(214,57%,24%,0.1);--cf-rest-shadow:none;--cf-active-shadow:inset 0 0 0 2px hsl(214,100%,48%);--cf-active-bg:hsla(214,100%,48%,0.10);--cf-outline-bg:hsla(214,100%,48%,0.06);--cf-sel-bg:hsla(214,100%,48%,0.20);--cf-ring:hsla(214,90%,52%,0.5);--cf-accent:hsl(214,100%,48%);--cf-err-shadow:inset 0 0 0 2px hsla(3,85%,49%,0.5);--cf-err-fg:hsl(3,89%,42%);--cf-dis-bg:hsla(214,57%,24%,0.05);--cf-dis-shadow:none;--cf-dis-fg:hsla(214,50%,22%,0.26);--cf-ro-bc:hsla(214,53%,23%,0.26);--cf-divider:hsla(214,57%,24%,0.12);',\n    panel: 'background:#fff;color:hsla(214,40%,16%,0.94);border:1px solid hsla(214,57%,24%,0.12);'\n  },\n  {\n    id: 'lumo-dark', name: 'Lumo \\u00b7 dark', sub: 'Contrast-10% on hsl(214,35%,21%) base; brighter accent',\n    vars: '--cf-font:-apple-system,BlinkMacSystemFont,\"Roboto\",\"Segoe UI\",Helvetica,Arial,sans-serif;--cf-fg:hsla(214,100%,98%,0.9);--cf-fg-2:hsla(214,96%,96%,0.7);--cf-fg-3:hsla(214,96%,96%,0.45);--cf-label-fs:14px;--cf-label-fw:500;--cf-label-c:hsla(214,96%,96%,0.7);--cf-w:40px;--cf-h:40px;--cf-fs:18px;--cf-gap:8p
